name: coreerp

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8088}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/ready') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      API_PROXY_TARGET: http://backend:8000
      # npm cache must be writable when the host UID differs from the image's node UID.
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: coreerp
      POSTGRES_USER: coreerp
      POSTGRES_PASSWORD: coreerp_local
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreerp -d coreerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8026}:8025"

volumes:
  postgres_data:
  redis_data:
